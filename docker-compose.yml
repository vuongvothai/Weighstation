services:
  mysql:
    image: mysql:8.0
    container_name: weighstation-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: nong_san_db
      MYSQL_USER: vuongvo
      MYSQL_PASSWORD: "1234"
    ports:
      - "3305:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - weighstation-net

  backend:
    build:
      context: ./backend/vuong
      dockerfile: Dockerfile
    container_name: weighstation-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3305/nong_san_db
      SPRING_DATASOURCE_USERNAME: vuongvo
      SPRING_DATASOURCE_PASSWORD: "1234"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    ports:
      - "8079:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - weighstation-net

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: weighstation-frontend
    restart: unless-stopped
    ports:
      - "5172:80"
    depends_on:
      - backend
    networks:
      - weighstation-net

volumes:
  mysql_data:

networks:
  weighstation-net:
    driver: bridge